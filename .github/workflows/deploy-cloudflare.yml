name: Deploy Cloudflare

on:
  push:
    branches: [main]
    paths:
      - web/**
      - tools/cloudflare/**
      - .github/workflows/deploy-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 022834eab232317fb2664393abda98bf
      CLOUDFLARE_PAGES_PROJECT: tsukirebuild
      CLOUDFLARE_R2_BUCKET: tsukirebuild-assets
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
    steps:
      - name: Check out the latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install the R2 client
        run: python -m pip install --disable-pip-version-check boto3==1.43.127
      - name: Sync R2 and deploy Pages
        run: python -u tools/cloudflare/deploy.py
